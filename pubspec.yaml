name: claude_watcher
description: 클로드코드 세션 상태를 화면 한켠에 띄우는 데스크톱 위젯
publish_to: 'none'
version: 1.119.9

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.0
  # 저장해둔 창 위치가 지금 화면 안인지 확인할 때 쓴다 (모니터를 빼면 화면 밖이 된다)
  screen_retriever: ^0.2.0
  desktop_drop: ^0.7.1
  qr: ^4.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
